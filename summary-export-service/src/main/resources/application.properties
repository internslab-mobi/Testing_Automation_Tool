server.port=8092
spring.application.name=summary-export-service

# Database Configuration (Connects read-only to existing MySQL database)
# Uses EXPORT_DB_URL / QA_DB_URL to avoid collisions with other local DB_URL environment variables
spring.datasource.url=${EXPORT_DB_URL:jdbc:mysql://192.168.11.101:3306/Interns_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${EXPORT_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${EXPORT_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration (NEVER alter tables - strictly read-only schema)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Shared JWT Security (Matches the main monolith's secret key)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
