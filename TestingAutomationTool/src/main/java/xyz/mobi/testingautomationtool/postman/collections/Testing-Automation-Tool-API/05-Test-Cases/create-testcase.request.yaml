        "precondition": "User must be registered",
        "testData": "username: johndoe, password: password123",
        "executionSteps": "1. Open login page\n2. Enter credentials\n3. Click login",
        "uiValidations": "Dashboard should be visible",
        "dbValidations": "Session token created",
