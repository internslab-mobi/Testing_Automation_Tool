$kind: http-request
name: Search Projects
order: 4000
method: GET
url: '{{baseUrl}}/project/search?keyword=test&status=ACTIVE'
queryParams:
  - key: keyword
    value: 'test'
    description: 'Search keyword'
  - key: status
    value: 'ACTIVE'
    description: 'Project status filter (ACTIVE, INACTIVE, etc.)'
