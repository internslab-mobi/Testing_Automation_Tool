$kind: http-request
name: Reset Password
order: 7000
method: POST
url: '{{baseUrl}}/auth/reset-password'
auth:
  type: noauth
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "john@example.com",
      "otp": "123456",
      "newPassword": "newpassword456"
    }
