$kind: http-request
name: Get All Test Cases
order: 4000
method: GET
url: '{{baseUrl}}/testcases?featureId=&status=&type=&priority=&page=0&size=10'
queryParams:
  - key: featureId
    value: ''
    description: 'Filter by feature ID'
  - key: status
    value: ''
    description: 'TestCaseStatus: ACTIVE, INACTIVE'
  - key: type
    value: ''
    description: 'TestType: FUNCTIONAL, REGRESSION, etc.'
  - key: priority
    value: ''
    description: 'TestPriority: LOW, MEDIUM, HIGH, CRITICAL'
  - key: page
    value: '0'
  - key: size
    value: '10'
