$kind: http-request
name: Add Comment to Bug
order: 1000
method: POST
url: '{{baseUrl}}/bugs/{{bugId}}/comments'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "comment": "This bug is reproducible on all browsers",
      "userId": 1,
      "createdBy": 1
    }
