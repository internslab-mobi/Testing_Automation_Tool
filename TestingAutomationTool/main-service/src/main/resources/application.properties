spring.application.name=main-service

server.port=8090
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:mysql://192.168.11.101:3306/Interns_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

springdoc.swagger-ui.request-interceptor=csrfRequestInterceptor

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Notification Microservice Configuration
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8091}

# Multipart File Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Cache Configuration
spring.cache.type=caffeine
spring.cache.cache-names=exceptionErrorMapping, projects, features, testCases, bugs, comments
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=1h

# JWT Security Configuration (same secret key used to validate tokens issued by auth-service)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:86400000}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

