spring.application.name=auth-service

server.port=8081
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:mysql://192.168.11.101:3306/Interns_db?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Notification Microservice Configuration for Password Reset OTP
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8091}

