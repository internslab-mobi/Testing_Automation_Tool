server:
  port: 8082

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
      # Global CORS for web browsers / SPAs
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                  - "http://127.0.0.1:4200"
                  - "http://localhost:8081"
                  - "http://127.0.0.1:8081"
                  - "http://localhost:8090"
                  - "http://127.0.0.1:8090"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                exposedHeaders:
                  - "Authorization"
                  - "X-XSRF-TOKEN"
                  - "X-CSRF-TOKEN"
                allowCredentials: true
                maxAge: 3600

          # Reverse Proxy Routes
          routes:
            # Route 1: Authentication Microservice (port 8081)
            - id: auth-service
              uri: ${services.auth-service.url}
              predicates:
                - Path=/auth/**

            # Route 2: Main Business Microservice (port 8090)
            - id: main-service-business
              uri: ${services.main-service.url}
              predicates:
                - Path=/manager/**, /project/**, /projects/**, /feature/**, /features/**, /testcases/**, /testcase/**, /bugs/**, /bug/**, /comments/**, /attachments/**, /in-app-notifications/**, /notifications/**, /admin/**

            # Route 3: Notification Microservice (port 8091)
            - id: notification-service
              uri: ${services.notification-service.url:http://localhost:8091}
              predicates:
                - Path=/api/v1/notifications/**

# Downstream Microservices target URLs
services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}
  main-service:
    url: ${MAIN_SERVICE_URL:http://localhost:8090}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8091}

