<div class="verify-otp-page">

  <div class="verify-otp-card">

    <div class="icon-badge">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <path d="m9 12 2 2 4-4"></path>
      </svg>
    </div>

    <h2>Enter Verification Code</h2>
    <p class="description">
      We sent a 6-digit OTP code to <br />
      <strong>{{ maskedEmail }}</strong>
    </p>

    <!-- Error Message -->
    <div class="alert-box error" *ngIf="errorMessage">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Success Message -->
    <div class="alert-box success" *ngIf="successMessage">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>{{ successMessage }}</span>
    </div>

    <!-- 6-digit OTP Input Group -->
    <div class="otp-inputs-wrapper" (paste)="onPaste($event)">
      <input
        *ngFor="let digit of otpDigits; let i = index"
        #otpInput
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="1"
        class="otp-digit-input"
        [class.filled]="digit !== ''"
        (input)="onDigitInput(i, $event)"
        (keydown)="onKeyDown(i, $event)"
        autocomplete="one-time-code"
        [attr.aria-label]="'Digit ' + (i + 1)"
      />
    </div>

    <!-- Resend Countdown -->
    <div class="resend-row">
      <span *ngIf="!canResend" class="countdown-text">
        Resend code in <strong>{{ formattedTimer }}</strong>
      </span>

      <button
        *ngIf="canResend"
        type="button"
        class="btn-resend"
        (click)="resendOtp()"
        [disabled]="isResending"
      >
        <span *ngIf="!isResending">Resend Code</span>
        <span *ngIf="isResending">Resending...</span>
      </button>
    </div>

    <!-- Submit Action -->
    <button
      type="button"
      class="btn-primary"
      (click)="verifyOtp()"
      [disabled]="!isOtpComplete || isLoading"
    >
      <span *ngIf="!isLoading">Verify Code</span>
      <span *ngIf="isLoading">Verifying...</span>
    </button>

    <!-- Navigation Back -->
    <div class="actions-footer">
      <a class="back-link" routerLink="/forgot-password">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>

        Change email address
      </a>
      <span class="dot">&bull;</span>
      <a class="back-link" routerLink="/login">
        Back to Login
      </a>
    </div>

    <footer class="auth-footer">
      <p>&copy; 2026 Testing Lifecycle Automation Tool</p>
    </footer>

  </div>

</div>
