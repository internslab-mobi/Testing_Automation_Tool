<header class="app-header">
  <div class="header-left">
    <button class="btn-hamburger" (click)="onToggleSidebar()" title="Toggle Navigation Sidebar">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="brand-logo">
      <div class="brand-badge"><i class="fa-solid fa-vial-circle-check"></i></div>
      <div class="brand-titles">
        <h1>TAT QA Cockpit</h1>
        <span>Test Lifecycle Automation Suite</span>
      </div>
    </div>
  </div>

  <div class="header-right">
    <!-- In-App Notifications Bell -->
    <button class="btn-header-icon" (click)="onOpenNotifications()" title="System Notifications">
      <i class="fa-regular fa-bell"></i>
      <span class="notif-badge" *ngIf="unreadNotificationCount > 0">{{ unreadNotificationCount }}</span>
    </button>

    <!-- User Profile & Sign Out -->
    <div class="user-chip">
      <div class="user-avatar">{{ userInitials }}</div>
      <div class="user-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRole }} (QA)</span>
      </div>
      <button class="btn-signout" (click)="onLogout()" title="Sign Out of Session">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </div>
</header>
