<div class="forgot-password-page">

  <div class="forgot-password-card">

    <div class="icon-badge">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>

    <h2>Forgot password?</h2>
    <p class="description">
      Enter your work email address and we will send you a 6-digit OTP to reset your password.
    </p>

    <!-- Error Alert -->
    <div class="alert-box error" *ngIf="errorMessage">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Success Alert -->
    <div class="alert-box success" *ngIf="successMessage">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <span>{{ successMessage }}</span>
    </div>

    <!-- Forgot password form -->
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" class="forgot-form">

      <div class="form-group">
        <label for="email">Work Email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
          </span>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="name@company.com"
            autocomplete="email"
            [class.invalid]="
              forgotPasswordForm.controls.email.invalid &&
              forgotPasswordForm.controls.email.touched
            "
          />
        </div>

        <div class="error-message" *ngIf="forgotPasswordForm.controls.email.touched && forgotPasswordForm.controls.email.invalid">
          <span *ngIf="forgotPasswordForm.controls.email.hasError('required')">Email is required.</span>
          <span *ngIf="forgotPasswordForm.controls.email.hasError('email')">Please enter a valid email address.</span>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="forgotPasswordForm.invalid || isLoading">
        <span *ngIf="!isLoading">Send reset OTP</span>
        <span *ngIf="isLoading">Sending OTP...</span>
      </button>

    </form>

    <a class="back-login" routerLink="/login">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Login</span>
    </a>

    <p class="expiry">
      OTP codes expire after 1 minutes.
    </p>

  </div>

</div>
