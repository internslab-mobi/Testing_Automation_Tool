spring.application.name=notification-service-test
server.port=0

notification.mail.outlook.host=localhost
notification.mail.outlook.port=2525
notification.mail.outlook.username=test@example.com
notification.mail.outlook.password=testpassword
notification.mail.outlook.auth=true
notification.mail.outlook.starttls.enable=false
notification.mail.outlook.starttls.required=false
notification.mail.outlook.default-from=test@example.com
notification.mail.outlook.sender-display-name=Test Sender
notification.mail.outlook.default-encoding=UTF-8
notification.mail.outlook.connection-timeout=5000
notification.mail.outlook.read-timeout=5000
notification.mail.outlook.write-timeout=5000
notification.mail.outlook.max-attachment-size-bytes=1048576
notification.mail.outlook.max-total-attachments-size-bytes=2097152
notification.mail.outlook.max-attachments-count=5
notification.mail.outlook.blocked-file-extensions=.exe,.bat,.cmd,.sh
notification.mail.outlook.allowed-recipient-domains=

# In-Memory H2 Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

