# ===================================================================
# Notification Service Configuration
# ===================================================================

spring.application.name=notification-service
server.port=${PORT:8091}

# -------------------------------------------------------------------
# Microsoft Outlook / SMTP Configuration
# -------------------------------------------------------------------
notification.mail.outlook.host=${OUTLOOK_SMTP_HOST:smtp.office365.com}
notification.mail.outlook.port=${OUTLOOK_SMTP_PORT:587}
notification.mail.outlook.username=${OUTLOOK_SMTP_USERNAME:}
notification.mail.outlook.password=${OUTLOOK_SMTP_PASSWORD:}
notification.mail.outlook.auth=${OUTLOOK_SMTP_AUTH:true}
notification.mail.outlook.starttls.enable=${OUTLOOK_SMTP_STARTTLS_ENABLE:true}
notification.mail.outlook.starttls.required=${OUTLOOK_SMTP_STARTTLS_REQUIRED:true}
notification.mail.outlook.default-from=${OUTLOOK_DEFAULT_FROM:notifications@example.com}
notification.mail.outlook.sender-display-name=${OUTLOOK_SENDER_NAME:Notification Service}
notification.mail.outlook.default-encoding=UTF-8

# Network Timeouts (in milliseconds)
notification.mail.outlook.connection-timeout=10000
notification.mail.outlook.read-timeout=15000
notification.mail.outlook.write-timeout=15000

# Attachment & Message Limits
notification.mail.outlook.max-attachment-size-bytes=10485760
notification.mail.outlook.max-total-attachments-size-bytes=26214400
notification.mail.outlook.max-attachments-count=10

# Blocked file extensions
notification.mail.outlook.blocked-file-extensions=.exe,.bat,.cmd,.sh,.vbs,.js,.ps1,.scr,.pif,.jar

# Optional recipient domain restrictions (comma-separated; leave empty to allow all domains)
notification.mail.outlook.allowed-recipient-domains=${ALLOWED_RECIPIENT_DOMAINS:}

# -------------------------------------------------------------------
# Actuator Monitoring & Health
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

# -------------------------------------------------------------------
# SpringDoc / Swagger OpenAPI UI (Can be disabled in production via env vars)
# -------------------------------------------------------------------
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha


# Logging Configuration
logging.level.root=INFO
logging.level.xyz.mobi.notificationservice=INFO
logging.level.org.springframework.mail=INFO

# -------------------------------------------------------------------
# MySQL Database Configuration (Configurable via Environment Variables)
# Dedicated database for Notification Microservice
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate (ddl-auto is none to prevent automatic schema modification on existing databases)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
